[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "shipyap"
version = "0.1.4"
description = "Shipyap: you ship. It yaps. With receipts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divyansh Shukla" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15,<2",
    "pydantic>=2.10,<3",
]

[project.scripts]
shipyap = "shipyap.automation.cli:main"
pros = "shipyap.automation.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "hypothesis>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/shipyap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "artifacts", ".pytest_cache", "evals"]  # evals: pinned bytes

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
