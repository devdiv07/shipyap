# Verbs that state a fact about the code, the tool or the repository. A p5 FRAMING sentence (no
# references) is blocked (FRAMING_HAS_CLAIM) when one follows a subject from
# framing_claim_subjects ("the tests keep them apart"); with any other subject, or none, it is
# the post's own wording ("a pleasant change", "easy to read"). Each entry also matches its plain
# inflections (-s, -es, -d, -ed, -ing); irregular forms are listed as well.
framing_claim_verbs = [
    "use", "call", "return", "refuse", "block", "check", "pass", "fail", "fix", "add", "remove",
    "change", "ship", "shipped", "shipping", "merge", "measure", "run", "ran", "post", "send",
