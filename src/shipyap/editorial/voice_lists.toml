# Story ranking for voice dry-nerdy (C2c): a backlog story whose angle or support holds one of
# these is a story with a change (a bug, a fix, a reversal, a failed run, a corrected result)
# and is drafted before plain descriptions of a repository. Descriptions are still drafted when
# nothing else is waiting. Each entry also matches its plain inflections.
# Kept to markers of something going wrong or being put right: bare "fix"/"fixed" ("fixed
# timers") and "breaks" ("each tamper breaks the hash") read as descriptions too often.
change_words = [
    "bug", "buggy", "defect", "regression", "broke", "broken", "crash", "revert", "reversal",
    "reversed", "corrected", "correction", "mistake", "wrong", "incorrect", "fail", "failed",
    "fails", "clobber", "mismatch", "no longer", "used to", "turned out", "found that",
    "withdrawn", "superseded", "deviation", "rollback", "rolled back", "flaky", "leak", "leaked",
    "stale", "a fix", "the fix", "and fixed", "was fixed", "is fixed", "been fixed", "got fixed",
    "now fixed", "fixed it", "cannot work", "can't work", "does not work", "doesn't work",
    "not atomic", "race condition", "never cleared", "anyone can", "overwritten", "not deployable",
    "a different model than", "can be changed after",
]

# Post formats for the rotation memory (`automation.rotation`), per voice. "plain" (p4) keeps
# its C2a bookkeeping list and nothing reads it; dry-nerdy (p5, C2b) alternates these two.
[formats]
plain = ["lesson", "before-after", "mistake", "how-it-works"]
dry-nerdy = ["plain", "code-punchline"]
