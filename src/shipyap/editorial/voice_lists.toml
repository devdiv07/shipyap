    "skipped", "retry", "retried", "parse", "load", "save", "delete", "rename", "compile",
    "deploy", "test", "catch", "caught", "match", "trigger", "record", "publish", "schedule",
    "flag", "flagged", "truncate", "split", "rewrite", "rewrote", "detect", "ignore", "import",
    "export", "cache", "fetch", "commit", "revert", "patch", "patched", "time out", "timed out",
    "fits", "fit", "fitted",
    "keep", "kept", "pin", "assert", "hold", "held", "show", "shown", "say", "said", "stay",
